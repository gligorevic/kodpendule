{% load i18n shop_urls static %}
<div
    id="shop-cookie-banner"
    class="shop-cookie-banner"
    role="region"
    aria-labelledby="shop-cookie-banner-title"
    aria-describedby="shop-cookie-banner-desc"
    hidden
>
    <div class="shop-cookie-banner__inner container shop-container">
        <div class="shop-cookie-banner__content">
            <h2 id="shop-cookie-banner-title" class="shop-cookie-banner__title">
                {% trans "Cookies on this website" %}
            </h2>
            <p id="shop-cookie-banner-desc" class="shop-cookie-banner__text mb-0">
                {% blocktrans trimmed %}
                Essential cookies keep your basket and sign-in working. You can change your cookie choice in the footer.
                {% endblocktrans %}
                <a href="{% shop_url 'core:privacy' %}">{% trans "Privacy Policy" %}</a>
            </p>
        </div>
        <div class="shop-cookie-banner__actions">
            <button type="button" class="shop-btn shop-btn--ghost shop-cookie-banner__btn js-cookie-consent-decline">
                {% trans "Decline" %}
            </button>
            <button type="button" class="shop-btn shop-btn--primary shop-cookie-banner__btn js-cookie-consent-accept">
                {% trans "Accept" %}
            </button>
        </div>
    </div>
</div>
