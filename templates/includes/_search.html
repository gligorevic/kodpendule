{% load shop_urls i18n %}
            <form id="shop-search" class="shop-header__search shop-search d-flex align-items-center" method="get"
                  action="{% if catalog_form_action %}{{ catalog_form_action }}#catalog-results{% else %}{% shop_url 'products:list' %}{% endif %}" role="search">
                {% if active_category and not catalog_has_categories %}<input type="hidden" name="kategorija" value="{{ active_category.slug }}">{% endif %}
                <label class="visually-hidden" for="shop-header-search">{% trans "Search" %}</label>
                <input id="shop-header-search" class="shop-header__search-input" type="search"
                       name="q" value="{{ request.GET.q|default:'' }}"
                       placeholder="{% trans 'Search products…' %}" autocomplete="off" maxlength="200">
                <button type="submit" class="shop-header__search-btn" aria-label="{% trans 'Search' %}">
                    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                </button>
            </form>
