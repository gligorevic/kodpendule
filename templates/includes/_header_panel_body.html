{% load shop_urls i18n static %}
<a class="shop-header-panel__brand" href="{% shop_url 'core:home' %}">
    <img src="{% static 'images/logo.webp' %}" alt="{% if site_settings %}{{ site_settings.site_name }}{% else %}{% trans 'Kod Pendule' %}{% endif %}" width="72" height="72" loading="lazy">
</a>

<nav class="shop-header-panel__nav" aria-label="{% trans 'Main navigation' %}">
    <ul class="nav flex-column shop-offcanvas__nav">
        {% include "includes/_header_nav_links.html" with link_class="shop-offcanvas__link" %}
    </ul>
</nav>

<div class="shop-offcanvas__section shop-header-panel__section">
    <p class="shop-offcanvas__section-title">{% trans "Language" %}</p>
    {% include "includes/_language_switcher.html" %}
</div>

<a class="shop-header-panel__cart shop-header__action" href="{% shop_url 'cart:detail' %}">
    <span class="shop-header__action-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6l-1-3H3"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>
        </svg>
    </span>
    <span>{% trans "Cart" %}</span>
    <span class="shop-header__badge shop-header-panel__cart-badge" data-cart-header-count{% if not cart_item_count %} hidden{% endif %}>{% if cart_item_count %}{{ cart_item_count }}{% else %}0{% endif %}</span>
</a>
