{% load shop_urls i18n %}
{% if home_nav_categories %}
<section class="shop-section shop-categories-home" id="home-categories" aria-labelledby="home-categories-title">
    <div class="container shop-container">
        <header class="shop-section__header shop-reveal" data-reveal>
            <div>
                <h2 class="shop-section__title" id="home-categories-title">{% trans "Shop by category" %}</h2>
            </div>
            <a class="shop-btn shop-btn--secondary shop-btn--sm" href="{% shop_url 'categories:list' %}">{% trans "All categories" %}</a>
        </header>

        {% language shop_language %}
        <div class="shop-categories-home__grid shop-reveal-stagger" data-reveal-stagger>
            {% for category in home_nav_categories %}
            <a class="shop-category-tile shop-reveal-child" href="{{ category.get_absolute_url }}">
                {% if category.image %}
                <img src="{{ category.image.url }}" class="shop-category-tile__img" alt="" loading="lazy" width="160" height="160">
                {% else %}
                <span class="shop-category-tile__img shop-category-tile__img--placeholder" aria-hidden="true"></span>
                {% endif %}
                <span class="shop-category-tile__name">{{ category.name }}</span>
            </a>
            {% endfor %}
        </div>
        {% endlanguage %}
    </div>
</section>
{% endif %}
