{% load shop_urls i18n %}
{% if nav_categories %}
<nav class="category-nav mb-4" aria-label="{% trans 'Categories' %}">
    <h2 class="shop-catalog-sidebar__title">{% trans "Categories" %}</h2>
    <ul class="shop-category-chips list-unstyled mb-0">
        <li><a class="shop-chip{% if not active_category %} is-active{% endif %}" href="{{ catalog_form_action }}{% querystring kategorija=None page=None %}"{% if not active_category %} aria-current="true"{% endif %}>
            {% trans "All products" %}
        </a></li>
        {% for category in nav_categories %}
        <li><a class="shop-chip{% if active_category_root_id == category.pk %} is-active{% endif %}"
           href="{{ catalog_form_action }}{% querystring kategorija=category.slug page=None %}"{% if active_category_root_id == category.pk %} aria-current="true"{% endif %}>
            {{ category.name }}
        </a></li>
        {% endfor %}
    </ul>
</nav>
{% endif %}
