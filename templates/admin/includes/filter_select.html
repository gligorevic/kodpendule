{% load i18n %}
<details data-filter-title="{{ title }}" open>
  <summary>{{ title }}</summary>
  <label class="visually-hidden" for="kp-filter-{{ spec.parameter_name }}">{{ title }}</label>
  <select id="kp-filter-{{ spec.parameter_name }}" class="kp-filter-select" data-admin-filter>
    {% for choice in choices %}<option value="{{ choice.query_string|iriencode }}"{% if choice.selected %} selected{% endif %}>{{ choice.display }}</option>{% endfor %}
  </select>
  <noscript><ul>{% for choice in choices %}<li{% if choice.selected %} class="selected"{% endif %}><a href="{{ choice.query_string|iriencode }}">{{ choice.display }}</a></li>{% endfor %}</ul></noscript>
</details>
