{% load i18n %}
<div class="shop-field mb-3{% if field.errors %} shop-field--invalid{% endif %}" id="checkout-field-{{ field.name }}">
    <label class="shop-field__label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="shop-field__req" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="shop-field__help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}<div id="{{ field.auto_id }}_errors">{% for error in field.errors %}<p class="shop-field__error">{{ error }}</p>{% endfor %}</div>{% endif %}
</div>
